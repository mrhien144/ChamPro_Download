name: ChấmPro gift entitlement server QA
on:
  push:
    branches: [fix/champro-gift-entitlement-server-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax and gift / login / paid-plan regressions
        run: |
          php -l platform/wordpress/champro-direct-login.php
          php -l tests/fixtures/champro-gift-wp.php
          php -l platform/wordpress/qa/gift-preflight.php
          node --test tests/champro-gift-entitlement.test.mjs tests/champro-gift-preflight.test.mjs tests/champro-gift-scope.test.mjs tests/champro-direct-php-sign.test.mjs tests/champro-wordpress-auto-key.test.mjs tests/champro-woocommerce-entitlement-recovery.test.mjs tests/offline-account-persistence-v146.test.mjs tests/champro-v1475-account-refresh.test.mjs
      - name: Package server plugin only
        run: |
          mkdir -p server-package/champro-direct-login
          cp platform/wordpress/champro-direct-login.php server-package/champro-direct-login/
          cd server-package
          zip -r ../ChamPro_Direct_Login_0.5.4_Candidate.zip champro-direct-login
      - uses: actions/upload-artifact@v4
        with:
          name: ChamPro_Direct_Login_0.5.4_Candidate
          path: ChamPro_Direct_Login_0.5.4_Candidate.zip
          if-no-files-found: error
