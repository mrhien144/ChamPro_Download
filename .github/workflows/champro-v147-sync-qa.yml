name: ChấmPro Sync QA v14.7 APK (isolated debug, not an update)
on:
  push:
    branches: [feature/champro-v146-offline-account-clean-ui-20261114]
    paths:
      - 'android-build/**'
      - 'app-preview/**'
      - 'tests/offline-account-persistence-v146.test.mjs'
      - '.github/workflows/champro-v147-sync-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Validate unchanged grader and new offline identity
        run: |
          node --check app-preview/app.mjs
          node --check app-preview/grader.mjs
          node --check android-build/app-sync.mjs
          node --check android-build/sync-device.mjs
          node --check android-build/account-direct.mjs
          node --check android-build/offline-license.mjs
          node --check app-preview/sync/start.mjs
          node --check app-preview/sync/client.mjs
          node --test tests/offline-license.test.mjs
          node --test tests/champro-auto-login.test.mjs
          node --test tests/native-network-indicator.test.mjs
          node tests/compact-key-scope-v146.test.mjs
          node tests/visual-answer-ii.test.mjs
          node tests/compact-points-preview.test.mjs
          node tests/preview-pending-code.test.mjs
          node tests/offline-account-persistence-v146.test.mjs
      - name: Bundle unchanged ChấmPro v14.6 grading with additive sync QA
        run: |
          mkdir -p _qa/app
          cp -a app-preview/. _qa/app/
          cp android-build/native-app.css android-build/native-app.js \
             android-build/photo-review-apk.mjs android-build/account-direct.mjs \
             android-build/offline-license.mjs android-build/update-app.mjs \
             android-build/auth-return.mjs android-build/app-sync.mjs \
             android-build/sync-device.mjs _qa/app/
          cp android-build/package.json _qa/package.json
          cp android-build/preview-capacitor.config.json _qa/capacitor.config.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('_qa/capacitor.config.json')
          j=json.loads(p.read_text())
          j['appId']='com.champro.syncqa.v147'
          j['appName']='ChấmPro Sync QA v14.7'
          p.write_text(json.dumps(j,ensure_ascii=False))
          PY
          python3 android-build/prepare-preview-apk.py _qa/app
          test -s _qa/app/sync/start.mjs
          grep -q 'app-sync.mjs' _qa/app/index.html
          ! grep -q 'BẢN THỬ NGHIỆM RIÊNG' _qa/app/index.html
          cmp app-preview/grader.mjs _qa/app/grader.mjs
          cmp app-preview/omr-native.mjs _qa/app/omr-native.mjs
          cmp app-preview/omr-verified-paper.mjs _qa/app/omr-verified-paper.mjs
      - name: Create Capacitor Android debug project
        working-directory: _qa
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Keep same Android camera/deep-link permissions
        run: |
          python3 android-build/enable-preview-camera.py _qa/android
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('_qa/android/app/build.gradle')
          s=p.read_text()
          s,n1=re.subn(r'versionCode\s+\d+', 'versionCode 14700',s,count=1)
          s,n2=re.subn(r'versionName\s+"[^"]+"', 'versionName "14.7-sync-qa"',s,count=1)
          assert n1==1 and n2==1
          p.write_text(s)
          PY
          grep -q 'android:scheme="champrotest145"' _qa/android/app/src/main/AndroidManifest.xml
      - name: Build debug APK (NOT signed for upgrading installed v14.6)
        working-directory: _qa/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify exact APK file
        run: |
          test -s _qa/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum _qa/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish separate QA-only APK (direct download, never overwrite v14.6)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="champro-sync-qa-v14.7-20261115"
          mkdir -p _qa_release
          cp _qa/android/app/build/outputs/apk/debug/app-debug.apk _qa_release/ChamPro-Sync-QA-v14.7.apk
          sha256sum _qa_release/ChamPro-Sync-QA-v14.7.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" _qa_release/ChamPro-Sync-QA-v14.7.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" _qa_release/ChamPro-Sync-QA-v14.7.apk --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "ChấmPro Sync v14.7 QA ONLY – không phải bản cập nhật" \
              --notes "APK ký debug, app ID riêng, KHÔNG chứa dữ liệu cũ. KHÔNG cài đè hoặc gỡ APK v14.6. Đồng bộ Cloudflare chưa mở cho dữ liệu thật. Chỉ thử trên máy sạch/dữ liệu giả."
          fi
      - name: Upload debug APK artifact for isolated QA
        uses: actions/upload-artifact@v4
        with:
          name: ChamPro-Sync-QA-v14_7-debug-APK-DO-NOT-OVERWRITE
          path: _qa/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
