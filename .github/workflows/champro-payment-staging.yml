name: ChấmPro payment bridge staging checks
on:
  push:
    branches:
      - staging/champro-payment-8919-8920-20261112
  pull_request:
    branches:
      - main
    paths:
      - 'platform/worker/**'
      - 'platform/wordpress/**'
      - 'platform/tests/**'
      - '.github/workflows/champro-payment-staging.yml'
permissions:
  contents: read
jobs:
  payment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PHP syntax
        run: php -l platform/wordpress/champro-bridge.php && php -l platform/tests/payment-bridge-test.php && php -l platform/wordpress/champro-checkout-gate.php
      - name: Checkout isolation and closed-default tests
        run: php platform/tests/champro-checkout-gate-test.php
      - name: Worker and account JS syntax
        run: node --check platform/worker/src/index.js && node --check platform/account/account.js && node --check platform/licensing/scan-license.js && node --check app/app.mjs
      - name: Scan authorization integration contract
        run: node platform/tests/scan-license-integration.test.mjs
      - name: Staging signed receipt settlement checks
        run: node platform/tests/sepay-settlement-test.mjs
      - name: SePay Test Mode webhook HMAC and duplicate tests
        run: node platform/tests/sepay-test-webhook.mjs
      - name: Payment bridge rejection and acceptance tests (fake WooCommerce)
        run: php platform/tests/payment-bridge-test.php
      - name: D1 payment SQL transaction tests (in-memory SQLite)
        run: python platform/tests/payment-worker-sql-test.py

      - name: Package guarded ChấmPro Bridge (not deployed)
        run: |
          mkdir -p build/champro-bridge
          cp platform/wordpress/champro-bridge.php build/champro-bridge/champro-bridge.php
          cd build
          zip -q -r ChamPro_Bridge_v0.1.5_guarded.zip champro-bridge
          unzip -l ChamPro_Bridge_v0.1.5_guarded.zip
      - name: Upload guarded Bridge ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChamPro-Bridge-v0.1.5-guarded
          path: build/ChamPro_Bridge_v0.1.5_guarded.zip
          retention-days: 30
