name: ChấmPro Preview Android APK
on:
  push:
    branches:
      - feature/champro-android-apk-preview-20261111
    paths:
      - 'android-build/**'
      - 'app-preview/**'
      - '.github/workflows/champro-preview-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use GitHub runner Android SDK
        run: |
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Verify preview modules and grading regression
        run: |
          node --check app-preview/app.mjs
          node --check app-preview/advanced.mjs
          node --check app-preview/qr-compatible.mjs
          node --check app-preview/grader.mjs
          node --check app-preview/result-review.mjs
          node --check app-preview/sheet-photo-store.mjs
          node --check android-build/native-app.js
          node --check android-build/photo-review-apk.mjs
          node --check app-preview/compact-answer-ui.mjs
          node --check app-preview/compact-points.mjs
          node tests/compact-points-preview.test.mjs
          node --test tests/preview-pending-code.test.mjs
      - name: Assemble complete offline preview web bundle
        run: |
          mkdir -p _champro_android/app
          cp -a app-preview/. _champro_android/app/
          cp android-build/native-app.css android-build/native-app.js android-build/photo-review-apk.mjs _champro_android/app/
          cp android-build/package.json _champro_android/package.json
          cp android-build/preview-capacitor.config.json _champro_android/capacitor.config.json
          # All local navigation must remain within this bundled offline app.
          python3 android-build/prepare-preview-apk.py _champro_android/app
      - name: Install Capacitor and generate Android project
        working-directory: _champro_android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Enable camera permission in the Android WebView
        run: |
          python3 android-build/enable-preview-camera.py _champro_android/android
      - name: Build test APK (debug signed, not production release)
        working-directory: _champro_android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK exists
        run: |
          test -s _champro_android/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum _champro_android/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChamPro-Preview-Android-Native-UI-APK
          path: _champro_android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
